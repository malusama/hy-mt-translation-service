# RunPod Project Configuration (Serverless)
#
# This repo's primary interface is HTTP (`/imme`, `/translate`, ...). RunPod Serverless is job-based,
# so we deploy a handler (`src/handler.py`) that implements the same request/response schemas via `job.input`.

name = "hy-mt-mlx-translation-service"

[project]
# Replace with your RunPod Project UUID.
uuid = "<your-runpod-project-uuid>"
base_image = "runpod/base:0.6.1-cuda11.8.0"
gpu_types = [
  "NVIDIA RTX A5000",
  "NVIDIA A30",
  "NVIDIA GeForce RTX 4090",
  "NVIDIA GeForce RTX 3090",
  "NVIDIA Tesla V100-PCIE-16GB",
]
gpu_count = 1
volume_mount_path = "/runpod-volume"
ports = "22/tcp"
container_disk_size_gb = 100

[endpoint]
active_workers = 0
max_workers = 3
flashboot = true

[runtime]
python_version = "3.11"
handler_path = "src/handler.py"
requirements_path = "builder/requirements.txt"

